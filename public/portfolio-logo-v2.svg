<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo variant 2: Geometric Monogram LP (overlapping) -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f46036"/>
      <stop offset="100%" stop-color="#f46036" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Dark rounded background -->
  <rect x="20" y="20" width="160" height="160" rx="28" fill="#171123"/>
  
  <!-- Letter P (Petrov) - outline -->
  <path d="M65 60 V140" stroke="#414770" stroke-width="12" stroke-linecap="round"/>
  <path d="M65 60 A35 35 0 0 1 100 60" stroke="#414770" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Letter L (Leonid) - overlapping, filled -->
  <path d="M100 55 V145" stroke="#f46036" stroke-width="14" stroke-linecap="round"/>
  <path d="M100 145 H160" stroke="#f46036" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Accent line -->
  <line x1="60" y1="165" x2="140" y2="165" stroke="#5b85aa" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
