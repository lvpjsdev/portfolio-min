<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo variant 1: Code Brackets with gradient background -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f46036"/>
      <stop offset="100%" stop-color="#5b85aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="20" y="20" width="160" height="160" rx="24" fill="#171123"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="70" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Left bracket < -->
  <path d="M55 60 L40 100 L55 140" 
        stroke="url(#accentGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Letter L (Leonid) - geometric, modern -->
  <path d="M80 55 V145" stroke="#5b85aa" stroke-width="8" stroke-linecap="round"/>
  <path d="M80 145 H140" stroke="#5b85aa" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right bracket > -->
  <path d="M145 60 L160 100 L145 140" 
        stroke="url(#accentGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Small accent dots -->
  <circle cx="100" cy="100" r="4" fill="#f46036"/>
  <circle cx="60" cy="100" r="2" fill="#5b85aa" opacity="0.7"/>
  <circle cx="140" cy="100" r="2" fill="#5b85aa" opacity="0.7"/>
</svg>
