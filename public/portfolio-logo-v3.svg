<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo variant 3: Neural Node / Code Connection -->
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f46036"/>
      <stop offset="50%" stop-color="#5b85aa"/>
      <stop offset="100%" stop-color="#414770"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#171123"/>
  
  <!-- Central node (circle) -->
  <circle cx="100" cy="100" r="28" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
  
  <!-- Connection lines radiating out -->
  <g stroke="#5b85aa" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="100" x2="100" y1="45"/>
    <line x1="100" y1="100" x2="155" y2="65"/>
    <line x1="100" y1="100" x2="155" y2="135"/>
    <line x1="100" y1="100" x2="100" y2="155"/>
    <line x1="100" y1="100" x2="45" y2="135"/>
    <line x1="100" y1="100" x2="45" y2="65"/>
  </g>
  
  <!-- Small orbiting dots -->
  <circle cx="100" cy="40" r="5" fill="#f46036"/>
  <circle cx="160" cy="70" r="4" fill="#5b85aa"/>
  <circle cx="160" cy="130" r="4" fill="#414770"/>
  <circle cx="100" cy="160" r="5" fill="#f46036"/>
  <circle cx="40" cy="130" r="4" fill="#5b85aa"/>
  <circle cx="40" cy="70" r="4" fill="#414770"/>
</svg>
